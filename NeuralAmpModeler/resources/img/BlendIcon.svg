<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Model blend icon</title>
  <desc>Three faders representing the blend levels of the NAM model slots.</desc>
  <!-- NAM Azure: rgb(80,133,232) / #5085E8 -->
  <!-- Transparent background. Overlapping rings turn to mush at this icon's 28px render size,
       so this reads as three levels instead, matching the slider-ring language of SlimmableIcon. -->
  <g shape-rendering="geometricPrecision">
    <line x1="8" y1="16" x2="56" y2="16" stroke="#F2F2F2" stroke-width="5" stroke-linecap="round"/>
    <line x1="8" y1="32" x2="56" y2="32" stroke="#F2F2F2" stroke-width="5" stroke-linecap="round"/>
    <line x1="8" y1="48" x2="56" y2="48" stroke="#F2F2F2" stroke-width="5" stroke-linecap="round"/>
    <circle cx="42" cy="16" r="8" fill="#5085E8"/>
    <circle cx="22" cy="32" r="8" fill="#5085E8"/>
    <circle cx="47" cy="48" r="8" fill="#5085E8"/>
  </g>
</svg>
